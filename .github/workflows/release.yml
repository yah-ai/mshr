name: release

# Publish this workspace's crates to crates.io when a vX.Y.Z tag is pushed.
# Auth is crates.io Trusted Publishing (OIDC) — no token is stored in the repo.
# Each publishable crate must have a Trusted Publisher configured on crates.io:
#   owner = yah-ai/mshr, workflow = release.yml.
#
# This mirror is an export of the yah monorepo's oss/mshr subtree; edit the
# workflow there, not here.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # required for crates.io Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # mshr is a single-crate workspace with no cross-repo deps and no
      # [patch.crates-io] block, so the exported mirror resolves standalone.
      # Its Cargo.lock is gitignored (oss/ convention) — no --locked here, or a
      # fresh CI checkout hard-errors with "cannot update the lock file".
      - name: build & test
        run: cargo test --workspace

      - name: authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: publish workspace (dependency-ordered)
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
